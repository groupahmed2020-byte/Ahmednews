<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | أحمد الأخباري</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-body">

    <div id="loginSection" class="login-container">
        <form id="loginForm" class="login-form">
            <h2>تسجيل الدخول للإدارة</h2>
            <div class="form-group">
                <input type="email" id="adminEmail" placeholder="البريد الإلكتروني" required>
            </div>
            <div class="form-group">
                <input type="password" id="adminPassword" placeholder="كلمة المرور" required>
            </div>
            <button type="submit" class="btn-primary">دخول</button>
            <p id="loginError" class="error-msg"></p>
        </form>
    </div>

    <div id="dashboardSection" class="dashboard-container" style="display: none;">
        <aside class="dashboard-sidebar">
            <h2>أحمد الأخباري</h2>
            <ul class="admin-menu">
                <li onclick="showTab('addPost')"><i class="fas fa-pen"></i> إضافة خبر/مقال</li>
                <li onclick="showTab('managePosts')"><i class="fas fa-list"></i> إدارة المحتوى</li>
                <li onclick="showTab('manageUsers')" id="usersMenuBtn"><i class="fas fa-users"></i> إدارة الأعضاء</li>
                <li onclick="showTab('settings')"><i class="fas fa-cog"></i> الإعدادات</li>
                <li id="logoutBtn"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</li>
            </ul>
        </aside>

        <main class="dashboard-content">
            <section id="addPost" class="admin-tab active">
                <h3>إضافة خبر جديد</h3>
                <form id="postForm">
                    <input type="text" id="postTitle" placeholder="عنوان الخبر" required>
                    <textarea id="postContent" placeholder="تفاصيل الخبر..." rows="6" required></textarea>
                    
                    <select id="postCategory">
                        <option value="politics">سياسة</option>
                        <option value="economy">اقتصاد</option>
                        <option value="tech">تكنولوجيا</option>
                        <option value="studies">دراسات وأبحاث</option>
                    </select>
                    
                    <div class="file-upload-group">
                        <label>رفع ملف (صورة/فيديو/مستند) من الجهاز أو الهاتف:</label>
                        <input type="file" id="localFileInput" accept="image/*,video/*,.pdf,.doc,.docx">
                        
                        <label>أو إضافة رابط خارجي (ميديا):</label>
                        <input type="url" id="externalUrlInput" placeholder="https://example.com/image.jpg">
                    </div>

                    <div class="status-group">
                        <label><input type="radio" name="postStatus" value="published" checked> نشر فوري</label>
                        <label><input type="radio" name="postStatus" value="urgent"> خبر عاجل</label>
                        <label><input type="radio" name="postStatus" value="draft"> حفظ كمسودة</label>
                    </div>

                    <button type="submit" class="btn-primary">حفظ ونشر</button>
                </form>
            </section>

            <section id="settings" class="admin-tab" style="display: none;">
                <h3>تغيير بيانات الدخول</h3>
                <form id="settingsForm">
                    <input type="email" id="newEmail" placeholder="البريد الإلكتروني الجديد">
                    <input type="password" id="newPassword" placeholder="كلمة المرور الجديدة">
                    <button type="submit" class="btn-primary">تحديث البيانات</button>
                </form>
            </section>
        </main>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
