<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | أحمد الأخباري</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">

    <div id="login-portal" class="login-container">
        <div class="login-box">
            <h2>تسجيل الدخول للإدارة</h2>
            <form id="login-form">
                <input type="text" id="username" placeholder="اسم المستخدم" required>
                <input type="password" id="password" placeholder="كلمة المرور" required>
                <button type="submit" class="btn btn-primary">دخول</button>
            </form>
        </div>
    </div>

    <div id="admin-dashboard" class="dashboard-layout" style="display: none;">
        <aside class="admin-sidebar">
            <h2>لوحة التحكم</h2>
            <ul>
                <li><a href="#" class="active"><i class="fas fa-pen"></i> إدارة الأخبار</a></li>
                <li><a href="#"><i class="fas fa-cog"></i> إعدادات الحساب</a></li>
                <li id="users-nav-item"><a href="#"><i class="fas fa-users"></i> إدارة الأعضاء</a></li>
                <li><a href="index.html"><i class="fas fa-globe"></i> العودة للموقع</a></li>
            </ul>
        </aside>

        <main class="admin-content">
            <header class="admin-header">
                <h2 id="page-title">إدارة الأخبار</h2>
                <div class="user-info">أهلاً، <span id="current-user"></span></div>
            </header>

            <div id="section-news" class="dashboard-section">
                <section class="admin-section">
                    <form id="add-news-form" class="post-form">
                        <input type="text" id="news-title" placeholder="عنوان الخبر" required>
                        <textarea id="news-content" placeholder="محتوى الخبر..." rows="5" required></textarea>
                        
                        <div class="upload-options" style="margin-bottom: 15px;">
                            <label>رابط صورة الغلاف (اختياري):</label>
                            <input type="url" id="news-image" placeholder="https://example.com/image.jpg">
                        </div>

                        <div class="form-row">
                            <select id="news-category">
                                <option value="سياسة">سياسة</option>
                                <option value="اقتصاد">اقتصاد</option>
                                <option value="تكنولوجيا">تكنولوجيا</option>
                                <option value="محليات">محليات</option>
                                <option value="دينية">دينية</option>
                                <option value="دراسات وأبحاث">دراسات وأبحاث</option>
                                <option value="English News">English News</option>
                            </select>
                            <select id="news-status">
                                <option value="منشور">منشور</option><option value="مسودة">مسودة</option><option value="عاجل">عاجل</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success">نشر الخبر <i class="fas fa-cloud-upload-alt"></i></button>
                    </form>
                </section>

                <section class="admin-section">
                    <h3>الأخبار الحالية</h3>
                    <table class="admin-table" id="news-table">
                        <thead>
                            <tr>
                                <th>العنوان</th>
                                <th>القسم</th>
                                <th>الحالة</th>
                                <th>الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- سيتم جلبها من فايربيس -->
                        </tbody>
                    </table>
                </section>
            </div>
            
            <div id="section-settings" class="dashboard-section" style="display: none;">
                <section class="admin-section">
                    <h3>إعدادات الحساب غير مفعلة حالياً</h3>
                </section>
            </div>
            <div id="section-users" class="dashboard-section" style="display: none;">
                <section class="admin-section">
                    <h3>إدارة الأعضاء غير مفعلة حالياً</h3>
                </section>
            </div>

        </main>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
