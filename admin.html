<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | موقع أحمد الأخباري</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-layout { display: flex; flex-direction: column; max-width: 1000px; margin: 20px auto; background: #fff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .admin-menu { background: #f8f9fa; border-bottom: 1px solid #ddd; padding: 10px; display: flex; flex-direction: column; }
        .admin-menu button, .admin-menu a { padding: 12px 15px; margin: 5px 0; border: none; background: transparent; text-align: right; cursor: pointer; font-size: 16px; font-weight: bold; color: #333; text-decoration: none; border-radius: 5px; transition: 0.3s; }
        .admin-menu button:hover, .admin-menu a:hover { background: #e9ecef; }
        .admin-menu button.active { background: #0056b3; color: #fff; }
        .admin-content { padding: 20px; flex: 1; background: #f4f7f6; }
        .tab-section { display: none; }
        .tab-section.active { display: block; }
        
        /* تنسيقات النموذج والجدول لتطابق صورتك */
        .white-box { background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 15px; background: #fafafa; }
        .btn-submit { background: #28a745; color: #fff; border: none; padding: 12px; cursor: pointer; border-radius: 4px; width: 100%; font-size: 16px; font-weight: bold; transition: 0.3s; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        table th, table td { padding: 12px; text-align: right; border-bottom: 1px solid #ddd; }
        table th { background: #f8f9fa; font-weight: bold; }
        .badge { padding: 5px 10px; border-radius: 4px; color: #fff; font-size: 12px; }
        .badge-publish { background: #28a745; }
        .badge-draft { background: #6c757d; }
        .badge-urgent { background: #dc3545; }

        @media (min-width: 768px) { 
            .admin-layout { flex-direction: row; align-items: flex-start; min-height: 100vh;} 
            .admin-menu { width: 250px; border-bottom: none; border-left: 1px solid #ddd; height: 100%; } 
        }
    </style>
</head>
<body>

    <div class="admin-layout">
        <!-- القائمة الجانبية -->
        <div class="admin-menu">
            <h2 style="padding: 15px; text-align: center; color: #333;">لوحة التحكم</h2>
            <button class="tab-btn active" onclick="openTab('newsSection')">✏️ إدارة الأخبار</button>
            <button class="tab-btn" onclick="openTab('accountSection')">⚙️ إعدادات الحساب</button>
            <button class="tab-btn" id="membersTabBtn" onclick="openTab('membersSection')">👥 إدارة الأعضاء</button>
            <a href="index.html" target="_blank">🌐 العودة للموقع</a>
        </div>

        <!-- محتوى اللوحة -->
        <div class="admin-content">
            
            <!-- 1. قسم إدارة الأخبار (إضافة / تعديل / عرض) -->
            <div id="newsSection" class="tab-section active">
                
                <!-- نموذج إضافة / تعديل الخبر -->
                <div class="white-box">
                    <h3 style="margin-bottom: 15px; border-bottom: 1px solid #ddd; padding-bottom: 10px;">إدارة الأخبار</h3>
                    <form id="addNewsForm">
                        <div class="form-group">
                            <input type="text" id="newsTitle" placeholder="عنوان الخبر" required>
                        </div>
                        <div class="form-group">
                            <textarea id="newsContent" rows="5" placeholder="محتوى الخبر..." required></textarea>
                        </div>
                        <div class="form-group">
                            <label>رابط صورة الغلاف (اختياري):</label>
                            <input type="url" id="newsImage" placeholder="https://example.com/image.jpg">
                        </div>
                        <div class="form-group">
                            <label>رابط فيديو المرفق (اختياري):</label>
                            <input type="url" id="newsVideo" placeholder="https://example.com/video.mp4">
                        </div>
                        <div class="form-group">
                            <label>رابط المستند / الملف المرفق (PDF, Word) (اختياري):</label>
                            <input type="url" id="newsDoc" placeholder="https://example.com/document.pdf">
                        </div>
                        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                            <select id="newsCategory" style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
                                <option value="سياسة">سياسة</option>
                                <option value="تكنولوجيا">تكنولوجيا</option>
                                <option value="محليات">محليات</option>
                                <option value="الدراسات والأبحاث">الدراسات والأبحاث</option>
                            </select>
                            <select id="newsStatus" style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
                                <option value="منشور">منشور</option>
                                <option value="عاجل">عاجل</option>
                                <option value="مسودة">مسودة</option>
                            </select>
                        </div>
                        <button type="submit" id="submitNewsBtn" class="btn-submit">نشر الخبر ☁️</button>
                        <button type="button" id="cancelEditBtn" style="display: none; background: #6c757d; color: #fff; border: none; padding: 12px; margin-top: 10px; cursor: pointer; border-radius: 4px; width: 100%;">إلغاء التعديل</button>
                    </form>
                </div>

                <!-- جدول الأخبار الحالية -->
                <div class="white-box">
                    <h3 style="margin-bottom: 15px;">الأخبار الحالية</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>العنوان</th>
                                <th>القسم</th>
                                <th>الحالة</th>
                                <th>الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="newsTableBody">
                            <!-- سيتم جلب الأخبار هنا بواسطة الجافاسكريبت -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 2. قسم إعدادات الحساب -->
            <div id="accountSection" class="tab-section">
                <div class="white-box" style="display: flex; justify-content: space-between; align-items: center;">
                    <h2 style="margin: 0;">إعدادات الحساب</h2>
                    <span id="welcomeMessage" style="font-weight: bold; color: #555;">أهلاً بك</span>
                </div>
                <div class="white-box">
                    <h3 style="margin-bottom: 15px; color: #0056b3;">تحديث بيانات الدخول</h3>
                    <form id="updateProfileForm">
                        <div class="form-group">
                            <label>اسم المستخدم الجديد</label>
                            <input type="text" id="newUsername" placeholder="اترك الحقل فارغاً إذا لم ترغب بتغييره">
                        </div>
                        <div class="form-group">
                            <label>كلمة المرور الجديدة</label>
                            <input type="password" id="newPassword" placeholder="اكتب كلمة المرور (6 أحرف على الأقل)">
                        </div>
                        <button type="submit" class="btn-submit" style="background: #0056b3;">حفظ التعديلات</button>
                    </form>
                </div>
            </div>

            <!-- 3. قسم إدارة الأعضاء -->
            <div id="membersSection" class="tab-section">
                <div class="white-box">
                    <h3>إدارة الأعضاء</h3>
                    <p>هذا القسم مخصص لإضافة أعضاء جدد أو تعديل حساباتهم. (قيد التطوير)</p>
                </div>
            </div>

        </div>
    </div>

    <!-- ربط ملف الجافاسكريبت -->
    <script type="module" src="admin.js"></script>

    <!-- سكريبت التنقل بين التبويبات -->
    <script>
        function openTab(tabId) {
            document.querySelectorAll('.tab-section').forEach(section => section.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
