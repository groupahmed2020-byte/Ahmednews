<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم | أحمد الأخباري</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo"><h1>لوحة التحكم</h1></div>
        <nav><a href="index.html" target="_blank">عرض الموقع</a></nav>
    </header>

    <div class="admin-container">
        <h2>إضافة خبر / مقال جديد</h2>
        <form>
            <div class="form-group">
                <label>عنوان الخبر</label>
                <input type="text" required>
            </div>
            <div class="form-group">
                <label>القسم</label>
                <select>
                    <option>سياسة</option>
                    <option>تكنولوجيا</option>
                    <option>الدراسات والأبحاث</option>
                </select>
            </div>
            <div class="form-group">
                <label>حالة الخبر</label>
                <select>
                    <option>منشور</option>
                    <option>مسودة</option>
                    <option>عاجل (يظهر في الشريط)</option>
                </select>
            </div>
            
            <hr style="margin: 20px 0;">
            <h3>الروابط الخارجية للميديا</h3>
            <div class="form-group"><label>رابط صورة (URL)</label><input type="url"></div>
            <div class="form-group"><label>رابط فيديو (URL)</label><input type="url"></div>
            <div class="form-group"><label>رابط مستند (URL)</label><input type="url"></div>

            <hr style="margin: 20px 0;">
            <h3>الرفع من الهاتف / الجهاز (مستقلة عن الروابط)</h3>
            <div class="form-group"><label>رفع صورة</label><input type="file" accept="image/*"></div>
            <div class="form-group"><label>رفع فيديو</label><input type="file" accept="video/*"></div>
            <div class="form-group"><label>رفع مستند (PDF/Word)</label><input type="file" accept=".pdf,.doc,.docx"></div>

            <div class="form-group">
                <label>محتوى الخبر</label>
                <textarea rows="6" required></textarea>
            </div>
            <button type="submit" class="btn-submit">نشر الخبر</button>
        </form>

        <div id="adminOnlySection" style="display: none; margin-top: 40px; padding-top: 20px; border-top: 2px solid var(--border-color);">
            <h2>إدارة متقدمة (خاص بالمدير)</h2>
            
            <div class="form-group" style="background: var(--bg-color); padding: 15px; border-radius: 5px;">
                <h3>إضافة إعلان محلي</h3>
                <label>رفع صورة أو فيديو للإعلان</label>
                <input type="file" accept="image/*,video/*">
                <label>رابط التوجيه عند النقر</label>
                <input type="url">
                <button class="btn-submit" style="margin-top: 10px;">حفظ الإعلان</button>
            </div>

            <div class="form-group" style="background: var(--bg-color); padding: 15px; border-radius: 5px; margin-top:15px;">
                <h3>إدارة الأعضاء (إضافة وتعديل)</h3>
                <label>اسم المستخدم (جديد أو حالي)</label>
                <input type="text">
                <label>كلمة المرور الجديدة</label>
                <input type="password">
                <button class="btn-submit" style="margin-top: 10px;">حفظ / إضافة العضو</button>
            </div>
        </div>
        
        <div style="margin-top: 40px; padding-top: 20px; border-top: 2px solid var(--border-color);">
            <h2>تعديل بيانات الدخول الخاصة بك</h2>
            <div class="form-group"><label>اسم المستخدم الجديد</label><input type="text"></div>
            <div class="form-group"><label>كلمة المرور الجديدة</label><input type="password"></div>
            <button class="btn-submit">تحديث البيانات الشخصية</button>
        </div>

    </div>

    <script src="admin.js"></script>
</body>
</html>
