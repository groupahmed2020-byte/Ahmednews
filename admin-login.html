<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - لوحة التحكم</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="admin-container" style="max-width: 400px; margin-top: 100px;">
        <h2 style="text-align: center; margin-bottom: 20px; color: var(--primary-color);">دخول الإدارة</h2>
        <form action="admin-dashboard.html">
            <div class="form-group">
                <label>اسم المستخدم</label>
                <input type="text" required>
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" required>
            </div>
            <button type="submit" class="btn-submit" style="width: 100%;">دخول</button>
        </form>
    </div>
</body>
</html>
