<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <div class="login-card">
        <h2 style="text-align: center; margin-bottom: 10px; color: var(--accent-color);">قفل الإدارة - موقع أحمد الإخباري</h2>
        <p style="text-align: center; margin-bottom: 20px; opacity: 0.7;">الوصول السريع والآمن للمسؤول</p>
        
        <form action="dashboard.html" method="GET">
            <div class="form-group">
                <label>اسم المستخدم</label>
                <input type="text" required placeholder="أدخل اسم المستخدم">
            </div>
            
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" required placeholder="أدخل كلمة المرور">
            </div>
            
            <button type="submit" class="btn-submit">دخول آمن سريـع</button>
        </form>
    </div>

</body>
</html>
