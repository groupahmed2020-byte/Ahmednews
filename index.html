<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع أحمد الأخباري | Ahmad News</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="main-header">
        <div class="container header-content">
            <div class="logo">
                <h1>أحمد الأخباري</h1>
            </div>
            <nav class="main-nav" id="mainNav">
                <button class="filter-btn active" data-filter="all">الرئيسية</button>
                <button class="filter-btn" data-filter="politics">سياسة</button>
                <button class="filter-btn" data-filter="economy">اقتصاد</button>
                <button class="filter-btn" data-filter="tech">تكنولوجيا</button>
                <button class="filter-btn" data-filter="studies">دراسات وأبحاث</button>
            </nav>
            <div class="header-actions">
                <button id="langToggle" class="btn-icon"><i class="fas fa-language"></i> EN</button>
                <button id="darkModeToggle" class="btn-icon"><i class="fas fa-moon"></i></button>
            </div>
        </div>
    </header>

    <div class="ticker-wrap">
        <div class="ticker-title">عاجل</div>
        <div class="ticker">
            <div class="ticker-item">أهلاً بكم في موقع أحمد الأخباري - مصدركم الأول للأخبار الموثوقة...</div>
            <div class="ticker-item">تحديثات جديدة في قسم الدراسات والأبحاث الاستراتيجية...</div>
        </div>
    </div>

    <main class="container main-grid">
        <section class="news-section" id="newsContainer">
            </section>

        <aside class="sidebar">
            <div class="widget weather-widget">
                <h3>حالة الطقس (فلسطين)</h3>
                <div id="weatherInfo">جاري التحميل...</div>
            </div>
            <div class="widget prayer-widget">
                <h3>مواقيت الصلاة</h3>
                <div id="prayerInfo">جاري التحميل...</div>
            </div>
        </aside>
    </main>

    <footer>
        <div class="container footer-content">
            <p>جميع الحقوق محفوظة &copy; 2026 موقع أحمد الأخباري</p>
            <a href="admin.html" class="admin-login-link" title="تسجيل دخول الإدارة"><i class="fas fa-lock"></i></a>
        </div>
    </footer>

    <script type="module" src="app.js"></script>
</body>
</html>
